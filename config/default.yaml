app:
  name: inDoc
  version: 1.0.0
server:
  host: 0.0.0.0
  port: 8000
api:
  prefix: /api/v1
storage:
  temp_path: ./tmp/indoc_temp
  storage_path: ./data/storage
security:
  jwt_algorithm: HS256
  jwt_expiration_minutes: 1440
  # jwt_secret_key is intentionally not committed; set via env or config/local.yaml
postgres:
  host: localhost
  port: 5432
  db: indoc
  user: indoc_user
  # password should come from env or local.yaml
redis:
  url: redis://localhost:6379
celery:
  broker_url: redis://localhost:6379/0
  result_backend: redis://localhost:6379/0
search:
  elasticsearch_url: http://localhost:9200
  elasticsearch_index: indoc_documents
  qdrant_url: http://localhost:6333
  qdrant_collection: documents
  qdrant_vector_size: 384  # MiniLM-L6 embedding dimension
  qdrant_distance: Cosine
ollama:
  base_url: http://localhost:11434
  # Primary chat/agent model for Insight Bridge + document Q&A.
  # qwen3:32b: strong structured tool JSON + contract/risk synthesis; fits multi-step budget.
  model: qwen3:32b
  # Local fallbacks (tried in order) when primary errors/times out/returns empty.
  # Prefer a fast installed chat model before any cloud provider.
  fallback_models:
    - glm-4.7-flash:latest
    - qwen3.6:27b
  # Per-request HTTP timeout. Agent plan/synthesize on a warm local 32B needs minutes, not 30s.
  timeout_s: 180
openai:
  # Last-resort cloud fallback only — local Ollama primary + local fallbacks come first.
  model: gpt-4o-mini
cors:
  origins:
    - http://localhost:5193
    - http://localhost:3000
telemetry:
  enabled: true
  otlp_endpoint: http://localhost:4317

