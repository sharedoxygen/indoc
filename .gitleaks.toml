# gitleaks configuration for inDoc
# Extends the default ruleset and allowlists known non-secrets:
# template files and a synthetic test-data generator (no real credentials).

title = "inDoc gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Templates, synthetic data, and CI-only test values — not real secrets"
paths = [
  '''\.env\.example$''',
  '''tools/realistic_seed_generator\.py$''',
  '''docs/index\.html$''',
  '''\.github/workflows/ci-full\.yml$''',
]
