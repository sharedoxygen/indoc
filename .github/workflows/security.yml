name: Security

# Secret scanning on every push and pull request. Fails the build if any
# credential, key, or token is detected in the tracked files.
# Uses the gitleaks binary directly (no license key required for this to run).

on:
  push:
    branches: [main, in-progress, development, publish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scan the tracked working tree (--no-git). Allowlist in .gitleaks.toml
      # covers templates and synthetic test data.
      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
