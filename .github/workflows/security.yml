name: Security

# Secret scanning on every push and pull request. Fails the build if any
# credential, key, or token is detected in the tracked files.
# Uses the gitleaks binary directly (no license key required for this to run).

on:
  push:
    branches: [main, in-progress, development, publish]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Reject secret filenames and credential defaults
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)config/local\.yaml$|(^|/)wrangler\.(toml|json|jsonc)$|(^|/)\.dev\.vars($|\.)|(^|/)\.wrangler(/|$)|(^|/)\.pafpublish\.json$' | grep -v '\.env\.example$'; then
            echo "Tracked secret filename"
            exit 1
          fi
          if git grep -nE '(PASSWORD|SECRET|API_KEY|ACCESS_KEY)\}?:-[A-Za-z0-9_!@#%^&*+=.,]+' -- ':!.github/workflows/security.yml' ':!.pre-commit-config.yaml'; then
            echo "Hardcoded credential fallback"
            exit 1
          fi
