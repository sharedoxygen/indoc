name: CI

# Fast, reliable checks on every push and PR: the backend byte-compiles and the
# autonomous-agent test suite passes. The full service-backed deploy pipeline
# lives in ci-full.yml (manual).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: pip

      - name: Byte-compile backend (syntax check)
        run: python -m compileall -q app tests tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run autonomous-agent test suite
        run: pytest tests/test_agent_service.py -q --noconftest --no-cov -p no:cacheprovider
