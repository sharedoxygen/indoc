name: CI/CD Pipeline (full)

# Full deploy pipeline: lint, service-backed tests, Docker build/push, staging
# deploy, and security/perf scans. Requires repository secrets and a green test
# suite. Kept as a manual (workflow_dispatch) workflow — enable triggers here
# once secrets and the full test suite are wired up.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_indoc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 9200:9200

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Node dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Lint Python code
      run: |
        pip install black flake8 mypy bandit safety
        black --check app --exclude="alembic/"
        flake8 app --exclude="alembic/"
        mypy app --ignore-missing-imports
        bandit -r app -ll
        safety check --ignore 70612
    
    - name: Lint TypeScript code
      run: |
        cd frontend
        npm run lint
        npm run type-check
    
    - name: Run Python tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_indoc
        REDIS_URL: redis://localhost:6379/0
        ELASTICSEARCH_URL: http://localhost:9200
        WEAVIATE_URL: http://localhost:8080
        JWT_SECRET_KEY: test-secret-key-for-ci-only
        FIELD_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktb25seQ==
        ENABLE_VIRUS_SCANNING: false
        ENABLE_VIRUSTOTAL: false
        ENABLE_WEAVIATE: false
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing -x
    
    - name: Run Enterprise Grade Tests (AI Guide §10)
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_indoc
        REDIS_URL: redis://localhost:6379/0
        ELASTICSEARCH_URL: http://localhost:9200
      run: |
        python tools/test_enterprise_grade.py || echo "⚠️ Enterprise tests had issues (non-blocking)"
    
    - name: Run Data Integrity Verification (AI Guide §5)
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_indoc
      run: |
        python tools/verify_integrity.py || echo "⚠️ Integrity check had issues (non-blocking)"
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: coverage.xml
        flags: backend
        name: backend-coverage
    
    - name: Security scan with Trivy
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker images
      run: |
        export REGISTRY=ghcr.io/${{ github.repository_owner }}
        export TAG=${{ github.sha }}
        docker buildx bake -f docker-bake.hcl --push

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add deployment scripts here
        # This could include:
        # - Updating Kubernetes manifests
        # - Running database migrations
        # - Health checks
        # - Rollback on failure

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
    
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/python
          p/typescript
    
    - name: Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'inDoc'
        path: '.'
        format: 'ALL'
    
    - name: Upload Dependency Check results
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: reports/

  performance-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Locust
      run: pip install locust
    
    - name: Run performance tests
      run: |
        # Start application in background
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        
        # Run load tests
        locust -f tests/performance/locustfile.py --host=http://localhost:8000 \
          --users 10 --spawn-rate 2 --run-time 60s --headless --csv=performance_results
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance_results*
