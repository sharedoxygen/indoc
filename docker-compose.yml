# inDoc application stack — compute only.
#
# SCALE MODEL: Postgres + Redis are external shared data services, not part of
# this Compose file. Point POSTGRES_* / REDIS_* at:
#   - local Homebrew (127.0.0.1 / host.docker.internal), or
#   - cloud managed offerings (RDS, Cloud SQL, ElastiCache, Memorystore, …)
# Backend + Celery replicas can then scale horizontally against that shared
# data plane without shipping a database container per instance.
#
# Isolation (local): database `indoc` / role `indoc_user`; Redis logical DB `/2`
# Bootstrap: psql -U postgres -f scripts/setup/ensure_baremetal_isolation.sql

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: indoc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: indoc-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indoc-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${POSTGRES_USER:-indoc_user}:${POSTGRES_PASSWORD:-indoc_dev_password}@host.docker.internal:5432/${POSTGRES_DB:-indoc}
      - REDIS_URL=redis://host.docker.internal:6379/2
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/2
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/2
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - elasticsearch
      - qdrant
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./data/uploads:/app/uploads

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indoc-celery-beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${POSTGRES_USER:-indoc_user}:${POSTGRES_PASSWORD:-indoc_dev_password}@host.docker.internal:5432/${POSTGRES_DB:-indoc}
      - REDIS_URL=redis://host.docker.internal:6379/2
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/2
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./config:/app/config

  flower:
    image: mher/flower:2.0
    container_name: indoc-flower
    command: celery --broker=redis://host.docker.internal:6379/2 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/2
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/2
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    container_name: indoc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: indoc-grafana
    ports:
      - "3030:3000" # Changed from 3000:3000 to avoid conflict
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      # If provisioning folders exist, mount them; otherwise Grafana UI can be used to add
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indoc-backend
    ports:
      # Host 8000 is reserved by PATi (trader-main-runtime). Publish inDoc on 8001.
      - "8001:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${POSTGRES_USER:-indoc_user}:${POSTGRES_PASSWORD:-indoc_dev_password}@host.docker.internal:5432/${POSTGRES_DB:-indoc}
      - REDIS_URL=redis://host.docker.internal:6379/2
      - CELERY_BROKER_URL=redis://host.docker.internal:6379/2
      - CELERY_RESULT_BACKEND=redis://host.docker.internal:6379/2
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - elasticsearch
      - qdrant
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./data/uploads:/app/uploads
    restart: unless-stopped

volumes:
  elasticsearch_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
